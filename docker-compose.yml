services:
  shiftcore-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shiftcore-runtime
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=qwen3:4b
      - OLLAMA_VERIFIER_MODEL=qwen3:4b
    volumes:
      - shiftcore_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: shiftcore-ollama
    profiles:
      - full-stack
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  shiftcore_data:
  ollama_models:
